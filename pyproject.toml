[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "package-ecosystem"
version = "0.1.0"
description = "A web-based interactive visualization tool for exploring dependency graphs across multiple package registries"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "black",
    "pyinstaller==6.10.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["*"]