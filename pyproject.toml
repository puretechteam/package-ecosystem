[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "package-ecosystem"
version = "0.1.0"
description = "A web-based interactive visualization tool for exploring dependency graphs across multiple package registries"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "black",
    "pyinstaller==6.10.0",
]

[tool.ruff.lint]
select = ["E", "F", "W", "FBT", "B", "A", "C4", "SIM", "I", "UP", "BLE", "RUF", "PLW", "S110"]
ignore = ["I001", "UP035", "UP006", "UP045", "UP024", "UP007", "BLE001", "C401", "F401", "F541", "PLW1508", "RUF059", "SIM103", "S110"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["*"]